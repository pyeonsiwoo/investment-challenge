function renderLeaderboard(show){const records=scoreboard();if(!records.length)return `<p class="small-note">아직 기록이 없습니다. 첫 번째 도전자가 되어 보세요.</p>`;return `<div class="panel" style="max-width:650px;margin:22px auto 0"><div class="panel-head"><div><div class="eyebrow">HALL OF FAME</div><h3>최고 기록</h3></div><span class="tag">이 브라우저의 기록</span></div><table class="rank-table"><thead><tr><th>순위</th><th>참가자</th><th>최종 자산</th></tr></thead><tbody>${records.slice(0,5).map((r,i)=>`<tr><td>${i+1}</td><td>${safeName(r.name)}</td><td>${money(r.score)}</td></tr>`).join('')}</tbody></table></div>`}
function startGame(onlineMatch=false){
 if(tickHandle)clearInterval(tickHandle);
 const name=onlineMatch?mp.name:((($('player-name')||{}).value)||'').trim()||'이름 없는 투자자';
 state={name:String(name).slice(0,24),cash:100,infoCoins:10,year:1,secondsLeft:360,started:true,finished:false,transitioning:false,holdings:{},costBasis:{},hintPurchases:{},hintResults:{},history:[],yearLog:[],startingWorth:100,onlineMatch:!!onlineMatch,matchSeed:onlineMatch?mp.seed:0};
 ASSETS.forEach(a=>a.price=1);startYear();
}
function startYear(){
 if(tickHandle)clearInterval(tickHandle);
 state.secondsLeft=360;state.transitioning=false;state.hintPurchases={};state.hintResults={};
 currentMarketRandom=state.onlineMatch?seededRandom((Number(state.matchSeed)||1)+(state.year*7919)):null;
 state.event=EVENTS[Math.floor(marketRandom()*EVENTS.length)];state.news=makeNews();state.returns={};
 ASSETS.forEach(a=>{let random=(marketRandom()*2-1)*a.vol;let impact=(state.event.impact&&state.event.impact[a.category])||0;let sectorImpact=(a.sector&&state.event.sector&&state.event.sector[a.sector])||0;let direct=(state.event.asset&&state.event.asset[a.id])||0;let r=a.base+random+impact+sectorImpact+direct;if(a.category==='deposit')r=Math.max(.012,Math.min(.072,r));else r=Math.max(-.68,Math.min(.62,r));state.returns[a.id]=r;});
 state.macro={rate:Math.max(1,Math.min(6,3.25+(marketRandom()-.5)*1.2+(state.event.title.includes('금리 인상')?.35:state.event.title.includes('금리 인하')?-.35:0))),inflation:Math.max(-.2,Math.min(8,2.3+(marketRandom()-.5)*2.8+(state.event.title.includes('물가')?1.5:0)))};
 renderGame();pushProgress();tickHandle=setInterval(()=>{if(!state||state.finished||state.transitioning)return;state.secondsLeft--;updateClock();if(state.secondsLeft<=0)closeYear(true)},1000);
}
function makeNews(){const notes=[
 `시장 참여자들은 ${['기업 실적','금리 변화','소비 지표','원자재 비용','신기술 투자'][Math.floor(marketRandom()*5)]}를 주의 깊게 보고 있다.`,
 `분산 투자는 한 자산의 손실이 전체 자산에 미치는 영향을 줄이는 데 도움이 될 수 있지만 손실을 완전히 막지는 못한다.`,
 `전문가 의견도 빗나갈 수 있다. 하나의 뉴스만 믿기보다 여러 지표와 자산의 위험을 비교해 보자.`,
 `장기 투자에서도 중간 가격은 크게 흔들릴 수 있다. 당장 필요한 돈과 투자할 돈을 구분하는 것이 중요하다.`,
 `배당이나 채권 이자는 현금 흐름을 제공하지만, 가격 하락이 그 수익을 넘어설 수도 있다.`
 ];return [state.event.desc,notes[Math.floor(marketRandom()*notes.length)],notes[Math.floor(marketRandom()*notes.length)]]}
function timerText(){const m=Math.floor(state.secondsLeft/60),s=state.secondsLeft%60;return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}
function renderGame(){const yr=state.year;const steps=[1,2,3,4,5].map(n=>`<div class="year-step ${n===yr?'active':n<yr?'done':''}">${n<yr?'✓ ':''}${n}년 차</div>`).join('');
 $('app').innerHTML=`<div class="brandline">A FINANCIAL STRATEGY GAME</div><div class="topbar"><div class="greeting"><small>INVESTOR · ${safeName(state.name)}</small><h2>제${yr}년 투자 전략</h2><p>뉴스를 분석하고, 자산 배분을 조정한 뒤 연도를 마감하세요.</p></div><div class="stats"><div class="stat money"><span>보유 현금</span><strong>${state.cash.toFixed(2)}</strong></div><div class="stat"><span>현재 순자산</span><strong>${netWorth().toFixed(2)}</strong></div><div class="stat info"><span>정보 코인</span><strong>${state.infoCoins}</strong></div><div class="stat timer"><span>남은 시간</span><strong id="timer-value">${timerText()}</strong></div></div></div><div class="year-track">${steps}</div>${renderRoomBoard()}
 <div class="news-grid"><section class="panel"><div class="panel-head"><div><div class="eyebrow">YEAR ${yr} · MARKET BRIEFING</div><h3>올해의 주요 뉴스</h3></div><span class="tag">시장 변수</span></div><div class="news-event">${state.event.title}</div><p class="news-desc">${state.event.desc}</p><ul class="news-list">${state.news.slice(1).map(n=>`<li>${n}</li>`).join('')}</ul></section><section class="panel"><div class="panel-head"><div><div class="eyebrow">ECONOMIC INDICATORS</div><h3>경제 지표</h3></div><span class="tag">참고 자료</span></div><div class="asset-metrics" style="margin-top:18px"><div>기준금리<strong>${state.macro.rate.toFixed(2)}%</strong></div><div>물가 상승률<strong>${state.macro.inflation.toFixed(2)}%</strong></div><div>보유 자산 수<strong>${ASSETS.filter(a=>(state.holdings[a.id]||0)>0).length}개</strong></div></div><p class="news-desc" style="margin-top:14px">지표는 투자 판단을 위한 참고 자료이며, 특정 자산의 수익을 보장하지 않습니다. 시장 뉴스의 영향은 자산마다 다르게 나타납니다.</p></section></div>
 <div class="section-title"><div><h3>투자 상품</h3><p>투자할 금액을 입력한 뒤 매수·매도를 선택하세요. 매도 금액은 현재 평가액 기준입니다.</p></div><span class="tag">BUY LOW · SELL SMART</span></div><div class="asset-grid">${ASSETS.map(renderAssetCard).join('')}</div>
 <div class="section-title"><div><h3>정보 상점</h3><p>각 분야에서 싼 힌트와 비싼 힌트를 하나씩 구매할 수 있습니다. 남은 정보 코인은 다음 해에도 유지됩니다.</p></div><span class="tag">힌트는 예측일 뿐, 정답이 아닙니다</span></div><div class="hint-grid">${Object.keys(CATEGORY_INFO).map(renderHintCard).join('')}</div>
 <div class="bottom-grid"><section class="panel"><div class="panel-head"><div><div class="eyebrow">PORTFOLIO</div><h3>내 투자 현황</h3></div><span class="tag">현재 평가액</span></div>${renderHoldingsTable()}</section><section class="panel"><div class="panel-head"><div><div class="eyebrow">YEARLY RECORD</div><h3>투자 기록</h3></div><span class="tag">최근 기록</span></div>${renderLogs()}</section></div>
 <div class="footer-actions"><p class="fineprint">연도 마감 시 자산 가격 변화가 반영되고, 예금 이자·채권 이자·주식 및 ETF 배당이 지급됩니다. 일부 연도에는 예기치 못한 보너스나 지출이 발생할 수 있습니다.</p><button class="gold-btn" onclick="askCloseYear()">${yr===5?'5년 차 결산하기':'연도 마감하고 다음 해로 →'}</button></div><p class="small-note">학습용 가상 게임 · 실제 투자 조언이 아닙니다.</p>`;
}
function renderAssetCard(a){const qty=state.holdings[a.id]||0;const val=qty*a.price;return `<article class="asset-card"><div class="asset-top"><div><div class="asset-symbol">${a.symbol}</div><h4>${a.name}</h4><div class="asset-type">${a.type}</div></div><span class="tag">${a.category==='deposit'?'예금':a.category==='bond'?'채권':a.category==='stock'?'주식':a.category==='etf'?'ETF':'원자재'}</span></div><div class="price">${a.price.toFixed(3)} <span style="font-size:11px;color:#93876c">코인/단위</span></div><div class="price-caption">올해 마감 후 가격이 변동됩니다</div><p class="asset-desc">${a.desc}</p><div class="asset-metrics"><div>예상 현금 수익<strong>${a.yield?`${(a.yield*100).toFixed(1)}%`:a.category==='deposit'?'예금 이자':'없음'}</strong></div><div>위험 수준<strong>${a.category==='deposit'?'낮음':a.id==='govbond'?'낮음~보통':a.category==='bond'?'보통~높음':a.vol>.2?'높음':a.category==='gold'?'보통':'보통~높음'}</strong></div></div><div class="holding-line">보유 평가액: <strong>${money(val)}</strong></div><div class="trade-row"><input class="amount-input" id="amount-${a.id}" type="number" min="1" max="${Math.max(1,state.cash)}" step="1" placeholder="금액 입력 (예: 10)" aria-label="${a.name} 거래 금액" /><button class="buy-btn" onclick="buyAsset('${a.id}')">매수</button><button class="sell-btn" onclick="sellAsset('${a.id}')" ${val<.01?'disabled':''}>매도</button></div></article>`}
function renderHintCard(cat){const info=CATEGORY_INFO[cat],cheapKey=`${cat}:cheap`,expKey=`${cat}:expensive`,cheapBought=!!state.hintPurchases[cheapKey],expBought=!!state.hintPurchases[expKey],result=state.hintResults[cat];return `<article class="hint-card"><h4>${info.label}</h4><p>${info.tip}</p><div class="hint-buttons"><button class="cheap" onclick="buyHint('${cat}','cheap')" ${cheapBought||state.infoCoins<1?'disabled':''}>저렴한 힌트 · 1코인</button><button class="expensive" onclick="buyHint('${cat}','expensive')" ${expBought||state.infoCoins<4?'disabled':''}>심층 힌트 · 4코인</button></div><div class="hint-bought">${cheapBought?'저렴한 힌트 구매 완료':expBought?'심층 힌트 구매 완료':''}</div><div class="hint-result ${result?'show':''}">${result||'아직 구매한 힌트가 없습니다.'}</div></article>`}
function renderHoldingsTable(){const holdings=ASSETS.filter(a=>(state.holdings[a.id]||0)>0);if(!holdings.length)return `<div class="empty">아직 투자한 상품이 없습니다.<br>현금 일부를 투자해 보세요.</div>`;return `<table class="holding-table"><thead><tr><th>상품</th><th>매입 단위</th><th>평가액</th><th>평가손익*</th></tr></thead><tbody>${holdings.map(a=>{const q=state.holdings[a.id],v=q*a.price,basis=state.costBasis[a.id]||0;const gain=v-basis;return `<tr><td>${a.name}</td><td>${q.toFixed(2)}</td><td>${money(v)}</td><td class="${gain>=0?'positive':'negative'}">${gain>=0?'+':''}${gain.toFixed(2)}</td></tr>`}).join('')}</tbody></table><p class="fineprint" style="margin-top:10px">* 평가손익은 실제 매수에 사용한 금액과 현재 평가액의 차이입니다. 지급된 이자·배당은 현금에 반영됩니다.</p>`}
function renderLogs(){if(!state.yearLog.length&&!state.history.length)return `<div class="empty">아직 기록이 없습니다.<br>첫 거래부터 기록됩니다.</div>`;const items=[...state.yearLog.slice(-3).reverse(),...state.history.slice(-5).reverse()].slice(0,7);return `<ul class="log-list">${items.map(item=>`<li>${item}</li>`).join('')}</ul>`}
function buyAsset(id){if(state.transitioning||state.finished)return;const a=ASSETS.find(x=>x.id===id);const input=$(`amount-${id}`);const amount=Number(input.value);if(!Number.isFinite(amount)||amount<=0){toast('매수 금액을 1코인 이상 입력해 주세요.');return}if(amount>state.cash+.0001){toast('보유 현금이 부족합니다.');return}state.cash-=amount;state.holdings[id]=(state.holdings[id]||0)+amount/a.price;state.costBasis[id]=(state.costBasis[id]||0)+amount;state.history.push(`<b>${state.year}년 차</b> · ${a.name} ${money(amount)} 매수`);renderGame();pushProgress();toast(`${a.name} 매수 완료`)}
function sellAsset(id){if(state.transitioning||state.finished)return;const a=ASSETS.find(x=>x.id===id);const input=$(`amount-${id}`);const amount=Number(input.value);const qty=state.holdings[id]||0;const value=qty*a.price;if(!qty){toast('매도할 보유 수량이 없습니다.');return}if(!Number.isFinite(amount)||amount<=0){toast('매도 금액을 1코인 이상 입력해 주세요.');return}const sellValue=Math.min(amount,value),sellQty=sellValue/a.price,ratio=Math.min(1,sellQty/qty);state.holdings[id]=Math.max(0,qty-sellQty);state.costBasis[id]=(state.costBasis[id]||0)*(1-ratio);if(state.holdings[id]<.000001){state.holdings[id]=0;state.costBasis[id]=0}state.cash+=sellValue;state.history.push(`<b>${state.year}년 차</b> · ${a.name} ${money(sellValue)} 매도`);renderGame();pushProgress();toast(`${a.name} 매도 완료`)}
function buyHint(cat,tier){if(state.transitioning||state.finished)return;const key=`${cat}:${tier}`;const cost=tier==='cheap'?1:4;if(state.hintPurchases[key]){toast('올해는 같은 단계의 힌트를 이미 구매했습니다.');return}if(state.infoCoins<cost){toast('정보 코인이 부족합니다.');return}state.infoCoins-=cost;state.hintPurchases[key]=true;const assets=categoryAssets(cat);const outcomes=assets.map(a=>({a,actual:state.returns[a.id]})).sort((x,y)=>y.actual-x.actual);const avg=outcomes.reduce((s,x)=>s+x.actual,0)/outcomes.length;let result='';
 if(tier==='cheap'){
  let signal=avg>=.08?'상승 가능성이 비교적 높음':avg>=.025?'완만한 상승 신호':avg>-.035?'방향이 엇갈리는 혼조':avg>-.10?'하락 위험에 주의':'하락 압력이 강한 편';
  const second=cat==='deposit'?'예금은 큰 가격 변동보다 이자 조건을 비교하는 편이 중요합니다.':cat==='bond'?'금리 변화와 발행자의 신용 위험을 함께 확인하세요.':cat==='stock'?'개별 기업의 차이가 커질 수 있으니 여러 기업을 비교하세요.':cat==='etf'?'ETF의 구성 종목이 어느 업종에 집중되어 있는지 살펴보세요.':'물가와 시장 불안이 금 가격에 영향을 줄 수 있지만 상승을 보장하진 않습니다.';
  result=`<strong>기본 신호: ${signal}</strong><br>이 분야의 단순 평균 예상 수익은 ${avg>=0?'플러스':'마이너스'} 방향입니다. ${second}`;
 }else{
  // Detailed clues are intentionally noisy; they are not guarantees or exact future returns.
  const est=outcomes.map(o=>({a:o.a,estimate:o.actual+(Math.random()-.5)*(cat==='stock'?.12:.07)})).sort((x,y)=>y.estimate-x.estimate);
  const low=Math.min(...est.map(x=>x.estimate)),high=Math.max(...est.map(x=>x.estimate));
  if(cat==='stock')result=`<strong>기업별 전망 비교</strong><br>상대적으로 유리한 후보: ${est.slice(0,2).map(x=>x.a.name).join(' · ')}<br>상대적으로 조심할 후보: ${est.slice(-2).map(x=>x.a.name).join(' · ')}<br>이 분야의 추정 범위: ${pct(low)} ~ ${pct(high)}. 기업별 차이가 크며 예측 오차가 발생할 수 있습니다.`;
  else if(cat==='bond')result=`<strong>금리·신용 위험 분석</strong><br>이자 수익만 보지 말고 가격 변동을 합쳐 판단하세요. 상품 간 추정 가격 변화 범위는 ${pct(low)} ~ ${pct(high)}이며, 회사채는 신용 불안 뉴스에 더 민감할 수 있습니다.`;
  else if(cat==='deposit')result=`<strong>금리 전망 분석</strong><br>예금 수익률 추정 범위: ${pct(low)} ~ ${pct(high)}. 물가 상승률(${state.macro.inflation.toFixed(1)}%)보다 이자가 낮으면 구매력이 줄어들 수도 있습니다.`;
  else if(cat==='etf')result=`<strong>ETF 비교 분석</strong><br>구성 자산별 추정 범위: ${pct(low)} ~ ${pct(high)}. 시장형과 기술형 ETF는 같은 해에도 결과가 다를 수 있습니다.`;
  else result=`<strong>금 가격 요인 분석</strong><br>금 가격 추정 변화 범위: ${pct(low)} ~ ${pct(high)}. 물가와 불확실성은 참고하되, 금도 손실을 낼 수 있다는 점을 기억하세요.`;
 }
 state.hintResults[cat]=result;state.history.push(`<b>${state.year}년 차</b> · ${CATEGORY_INFO[cat].label} ${tier==='cheap'?'저렴한':'심층'} 힌트 구매 (-${cost} 정보 코인)`);renderGame();pushProgress();toast(`${CATEGORY_INFO[cat].label} 힌트를 구매했습니다.`)}
function askCloseYear(){if(state.transitioning||state.finished)return;const cover=document.createElement('div');cover.className='confirm-cover';cover.id='confirm-close';cover.innerHTML=`<div class="confirm-box"><div class="eyebrow">YEAR ${state.year} SETTLEMENT</div><h3>${state.year}년 차를 마감할까요?</h3><p>연도를 마감하면 투자 상품 가격 변동과 이자·배당이 반영됩니다. 남은 시간은 이월되지 않습니다.</p><div class="actions"><button class="ghost-btn" onclick="document.getElementById('confirm-close').remove()">계속 투자하기</button><button class="gold-btn" onclick="document.getElementById('confirm-close').remove();closeYear(false)">연도 마감</button></div></div>`;document.body.appendChild(cover)}
function closeYear(auto){if(!state||state.finished||state.transitioning)return;state.transitioning=true;if(tickHandle){clearInterval(tickHandle);tickHandle=null}const before=netWorth(),cashBefore=state.cash;let interest=0,dividends=0;const summary=[];
 ASSETS.forEach(a=>{const qty=state.holdings[a.id]||0;if(!qty)return;const oldValue=qty*a.price;const ret=state.returns[a.id];a.price=Math.max(.02,a.price*(1+ret));const newValue=qty*a.price;const income=newValue*a.yield;if(income>0){state.cash+=income;dividends+=income;if(a.category==='bond')interest+=income;}summary.push(`${a.name} ${pct(ret)}`)});
 // A small chance of a non-market personal finance event adds another way to gain or lose money.
 let surprise='';const r=Math.random();if(r<.14){const bonus=4+Math.random()*8;state.cash+=bonus;surprise=`예상치 못한 프로젝트 보상 +${bonus.toFixed(2)}코인`; }else if(r<.27){const bill=3+Math.random()*8;const actual=Math.min(state.cash,bill);state.cash-=actual;surprise=`예상치 못한 지출 -${actual.toFixed(2)}코인`;}
 const after=netWorth(),change=after-before;const yline=`<b>${state.year}년 차 결산</b> · 순자산 ${before.toFixed(2)} → ${after.toFixed(2)}코인 (${change>=0?'+':''}${change.toFixed(2)})`;state.yearLog.push(yline);if(summary.length)state.history.push(`<b>시장 반영</b> · ${summary.slice(0,4).join(' / ')}${summary.length>4?' …':''}`);if(dividends>0)state.history.push(`<b>현금 수익</b> · 이자·배당 +${dividends.toFixed(2)}코인`);if(surprise)state.history.push(`<b>돌발 변수</b> · ${surprise}`);state.lastSettlement={before,after,change,surprise,summary,dividends,interest};
 if(state.year>=5){state.finished=true;saveScore({name:state.name,score:Number(after.toFixed(2)),date:new Date().toLocaleDateString('ko-KR')});pushProgress();renderEnd();}
 else{state.year+=1;startYear();toast(`${state.year-1}년 차 결산 완료 · ${change>=0?'+':''}${change.toFixed(2)}코인`)} }
function renderEnd(){if(tickHandle)clearInterval(tickHandle);tickHandle=null;const final=netWorth(),gain=final-state.startingWorth,ratio=gain/state.startingWorth*100,records=scoreboard();const rank=records.findIndex(r=>r.name===state.name&&r.score===Number(final.toFixed(2)))+1;
 $('app').innerHTML=`<div class="brandline">CHALLENGE COMPLETED</div><div class="end-panel"><div class="eyebrow">5 YEARS · FINAL SETTLEMENT</div><h2>투자 챌린지 종료</h2><p class="subtitle" style="margin-bottom:5px">${safeName(state.name)}의 5개년 투자 결과</p><div class="final-score">${money(final)}</div><div class="${gain>=0?'positive':'negative'}" style="font:17px Arial,sans-serif">${gain>=0?'+':''}${gain.toFixed(2)} 코인 (${ratio>=0?'+':''}${ratio.toFixed(1)}%)</div><p class="result-note">${gain>0?'초기 자산보다 순자산이 증가했습니다. 어떤 선택이 도움이 되었는지 연도별 기록을 살펴보세요.':gain<0?'초기 자산보다 순자산이 감소했습니다. 특정 자산에 집중했는지, 시장 뉴스와 위험을 어떻게 판단했는지 되짚어 보세요.':'초기 자산과 최종 자산이 같습니다. 수익뿐 아니라 위험과 기회비용도 함께 돌아보세요.'}<br>${state.onlineMatch?'같은 방의 실시간 순위는 아래 표에서 확인할 수 있습니다.':'최종 순위는 이 브라우저에 저장된 최고 기록을 기준으로 표시됩니다.'}</p><div class="panel" style="max-width:700px;margin:0 auto 20px;text-align:left"><div class="panel-head"><div><div class="eyebrow">YEAR-BY-YEAR</div><h3>연도별 결산</h3></div></div><table class="holding-table"><thead><tr><th>연도</th><th>시장 이벤트</th><th>순자산 변화</th></tr></thead><tbody>${state.yearLog.map((l,i)=>{const hs=state.history.find(x=>x.includes(`${i+1}년 차`)&&x.includes('시장 반영'));return `<tr><td>${i+1}년 차</td><td style="text-align:left">${i===0?'시장 상황 변화':i===1?'기업별 수익률 차이':i===2?'가격·이자·배당 반영':i===3?'현금 흐름과 위험': '최종 시장 반영'}</td><td>${l.replace(/<[^>]*>/g,'')}</td></tr>`}).join('')}</tbody></table></div><div class="panel" style="max-width:700px;margin:0 auto;text-align:left"><div class="panel-head"><div><div class="eyebrow">HALL OF FAME</div><h3>참가자 순위</h3></div><span class="tag">TOP 10</span></div><table class="rank-table"><thead><tr><th>순위</th><th>참가자</th><th>최종 자산</th><th>기록일</th></tr></thead><tbody>${records.map((r,i)=>`<tr class="${r.name===state.name&&r.score===Number(final.toFixed(2))?'mine':''}"><td>${i+1}</td><td>${safeName(r.name)}</td><td>${money(r.score)}</td><td>${safeName(r.date||'')}</td></tr>`).join('')}</tbody></table></div>${state.onlineMatch?`<div style="max-width:700px;margin:22px auto"><button class="ghost-btn" onclick="leaveRoom()">대결 방 나가기</button></div>`:`<div style="max-width:700px;margin:22px auto;display:grid;grid-template-columns:1fr 1fr;gap:10px"><button class="gold-btn" onclick="restartForNext()">다른 참가자 도전</button><button class="ghost-btn" onclick="renderWelcome()">처음 화면으로</button></div>`}${state.onlineMatch?`<div class="panel" style="max-width:750px;margin:20px auto;text-align:left"><div class="panel-head"><div><div class="eyebrow">LIVE ROOM RESULT</div><h3>같은 방 실시간 순위</h3></div><span class="online-pill">${safeName(mp.roomCode)}</span></div><div id="room-final-board" class="room-board-wrap">${renderRoomBoardContents()}</div><p class="fineprint">다른 참가자가 게임을 진행 중이면 순위와 최종 자산은 계속 갱신됩니다. 방장이 만든 탭이 열려 있어야 연결됩니다.</p></div>`:''}<p class="fineprint" style="margin:25px auto 0">${state.onlineMatch?'온라인 순위는 방장이 연결을 유지하는 동안 같은 방 참가자에게 공유됩니다.':'기록은 현재 브라우저에만 저장됩니다. 다른 컴퓨터나 브라우저와 자동으로 공유되지 않습니다.'} 게임은 교육용 가상 모델이며 실제 시장을 그대로 재현하지 않습니다.</p></div>`}
function restartForNext(){if(state&&state.onlineMatch){toast('온라인 대결은 방의 순위를 확인한 뒤 방을 나가 주세요.');return}state=null;ASSETS.forEach(a=>a.price=1);renderWelcome()}
function updateClock(){const el=$('timer-value');if(el)el.textContent=timerText()}
renderWelcome();
</script>
